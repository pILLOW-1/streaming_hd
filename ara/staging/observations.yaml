  - {"id": "O03", "timestamp": "2026-09-09T18:40+10:00", "provenance": "ai-suggested", "content": "On this fixed three-model seed42 benchmark, pooling learned features with the content scorer had broader primary-metric gains than raw-hidden max. Different optimizer and model pipelines remain confounded; the results do not isolate pooling space as the cause.", "context": "Interpretation of the independently audited pooling controls; no explicit researcher endorsement of this mechanistic interpretation.", "potential_type": "claim", "bound_to": ["N15"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": true}
  - {"id": "O04", "timestamp": "2026-09-09T19:34+10:00", "provenance": "ai-suggested", "content": "On the frozen Qwen/Llama TEST subset, prompt cosine outperformed prompt bilinear on AUROC, accuracy and F1 for both models. Relative to Streaming, content_only and feature_max, its clearest consistent benefit was F1, while AUROC and accuracy remained mixed by model and baseline.", "context": "Interpretation of the independently audited four-cell partial TEST result; DeepSeek is excluded and the researcher has not endorsed a general mechanism claim.", "potential_type": "claim", "bound_to": ["N21"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": true}
  - {"id": "O05", "timestamp": "2026-09-09T21:23+10:00", "provenance": "ai-suggested", "content": "For the learned-feature weighted architecture, adding final pooled-vector L2 reduced TEST AUROC on all three models and produced a large Qwen F1 gain but near-zero or negative Llama/DeepSeek F1 changes. This suggests scale removal changes the operating point in a model-dependent way rather than uniformly improving ranking.", "context": "Interpretation of N24; the researcher has not endorsed this mechanism claim.", "potential_type": "claim", "bound_to": ["N24"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": true}
  - {"id": "O06", "timestamp": "2026-09-09T21:23+10:00", "provenance": "ai-suggested", "content": "Removing final pooled-vector L2 from canonical content_only increased TEST AUROC for all three models and improved five of six ACC/F1 cells, with Qwen ACC the only decrease. The consistent ranking gain is compatible with useful magnitude information in pooled hidden states, but one seed and three models do not establish a general mechanism.", "context": "Interpretation of N26; the researcher has not endorsed this mechanism claim.", "potential_type": "claim", "bound_to": ["N26"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": true}
  - {"id": "O07", "timestamp": "2026-09-10T23:32+10:00", "provenance": "ai-suggested", "content": "On this fixed three-model seed42 benchmark, one same-width residual mapper layer did not produce a majority AUROC improvement over the authoritative learned-feature weighted parent; the effect was model- and metric-dependent. This does not establish that mapper capacity is generally unhelpful.", "context": "Interpretation of independently validated N29; the researcher has not yet commented on the outcome.", "potential_type": "claim", "bound_to": ["N29"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": true}
  - {"id": "O08", "timestamp": "2026-09-11T12:02+10:00", "provenance": "ai-suggested", "content": "On the frozen identical-population TEST analysis, Step-level AUROC declined from Early to Late for all three methods and models. Qwen/Llama F1 rose alongside large recall and positive-rate increases, whereas DeepSeek positive rate stayed near 13% and recall/F1 fell. Learned-feature AUROC gains over Streaming concentrated in Qwen Middle/Late and Llama Early; DeepSeek gains were small and diminished across stages.", "context": "Interpretation of independently validated N31; the researcher requested analysis but has not yet endorsed this cross-stage interpretation.", "potential_type": "claim", "bound_to": ["N31"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": true}
  - {"id": "O09", "timestamp": "2026-09-11T16:16:49+10:00", "provenance": "ai-suggested", "content": "On this three-model seed42 benchmark, TRAIN-ratio positive weighting mainly changed the fixed 0.5 operating point rather than improving rank discrimination: recall increased for every model, AUROC decreased slightly for every model, and the precision cost became severe under DeepSeek's larger imbalance ratio. The result does not establish that class weighting is generally harmful, and alternative thresholds were outside the frozen protocol.", "context": "Interpretation of independently validated N33; the researcher has not yet endorsed this mechanism claim.", "potential_type": "claim", "bound_to": ["N33"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": true}
  - {"id": "O10", "timestamp": "2026-09-13T21:11+10:00", "provenance": "ai-suggested", "content": "For this fixed seed42 learned-feature detector and canonical VAL population, Qwen/Llama show both an upward normal-score shift and lower late-stage rank separation; DeepSeek shows a smaller normal-score movement without a resolved Early-to-Late AUROC loss. Prevalence changes are observational and do not by themselves imply a detector defect, miscalibration, or a useful TEST threshold change.", "context": "Interpretation of the independently validated stage score and trajectory-bootstrap diagnostic N36; no researcher endorsement or causal test.", "potential_type": "claim", "bound_to": ["N36"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": true}
  - {"id": "O11", "timestamp": "2026-09-16T15:16+10:00", "provenance": "ai-suggested", "content": "On this fixed three-model seed42 learned-feature benchmark, exact four-group TRAIN balancing consistently reduced the absolute prior-Prefix-conditioned false-negative gap, but it did not preserve natural-VAL performance sufficiently and had mixed effects on the false-positive gap and conditional AUROC. The pattern is compatible with a trade-off between conditional error equalization and natural-distribution discrimination, not proof that Prefix information was causally removed.", "context": "Interpretation of independently validated N69; all three predeclared descriptive support gates failed and the researcher has not commented on the outcome.", "potential_type": "claim", "bound_to": ["N69"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": true}
  - {"id": "O12", "timestamp": "2026-09-23T14:51:28+10:00", "provenance": "ai-suggested", "content": "A provider-neutral S3-compatible object-store relay with immutable checksum-bound shards, cloud-side commit markers, Cetus-side verified pull and atomic promotion can separate compute-provider choice from durable experiment storage. The overall experiment should be complete only after Cetus writes an ingestion acknowledgment, while GPU resources may terminate after the final object-store commit.", "context": "Proposed architecture for N136 after verifying RunPod and Shadeform credentials and installing Vast.ai support; object-store provider and credentials remain unselected.", "potential_type": "architecture", "bound_to": ["N136"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": false}
  - {"id": "O13", "timestamp": "2026-10-14T16:56+11:00", "provenance": "ai-suggested", "content": "Repair-sensitive endorsement, warrant, dependence/alternative-support and repair-coverage descriptors are a candidate StreamingHD feature family. Small-family sufficiency, reliable activation extraction and full-distribution performance remain untested; finite exact-update characterization is only an analytic benchmark.", "context": "Source-pattern theory run; native draft failed export validity and final proof cleanup stopped at security/approval gate.", "potential_type": "architecture", "bound_to": ["N144"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": false}
  - {"id": "O14", "timestamp": "2026-10-15T09:51+11:00", "provenance": "ai-suggested", "content": "Candidate Step mechanism is nonlinear token transformation before aggregation, but current pipeline comparisons confound capacity, layer, normalization and optimization; adaptive weights lack consistent isolated benefit. Prefix onset/clearance warrants cost- and semantics-aware evaluation, yet present evidence does not identify selective state-update failure or recurrent-memory necessity. Fixed-pool MLP and contextual last-token MLP are decisive competing controls.", "context": "Two native consultations plus main corrective source review; historical TEST diagnostic only, no new controls executed.", "potential_type": "claim", "bound_to": ["N149", "N150"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": false}
  - {"id": "O15", "timestamp": "2026-10-18T12:05+11:00", "provenance": "ai-suggested", "content": "A conditional explanation for actual fixed-eval shared-C couples prototype closeness and evidence attention mass with the full joint score/value sensitivity and normalized biased margin. Larger scoring scale trades selection against sensitivity; no universal noise reduction, baseline/KV necessity, optimizer success or actual-data premise follows.", "context": "Native model-checked theorem and seven-page manuscript; semantic-to-feature and learned-parameter applicability remain empirical.", "potential_type": "claim", "bound_to": ["N152"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": false}
  - {"id": "O16", "timestamp": "2026-10-19T10:12+11:00", "provenance": "ai-suggested", "content": "For the explicit finite one-query snapshot/no-reread/no-feedback model with uniform active bits and independent complement repair, current binary-label sufficiency is weaker than selective-repair sufficiency. The native-checked standard entropy/covering argument quantifies charged identity information and supplies a matched asymptotic construction. Actual contextual encoders may reconstruct that information; this has not identified the cause of any current Prefix failure.", "context": "Completed bounded Prefix theory; task semantics and restricted information access are assumptions, not certified hidden-state collisions or annotation properties.", "potential_type": "claim", "bound_to": ["N154"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": false}
  - {"id": "O17", "timestamp": "2026-10-19T12:00+11:00", "provenance": "ai-suggested", "content": "Under explicit finite semantic-event observability and bounded-state-error premises, corrective state re-encoding supports full-process retention and scoped updating. A normalized local-background candidate class loses uniform robustness under fixed positive readout perturbation, while scalar refresh can succeed if contextual candidates already reconstruct current state and gate/head margins suffice. These conditions do not establish real-data extractor success, actual contextual-feature failure, KV necessity or performance advantage.", "context": "Accepted new conditional fact; English manuscript remains blocked by whole-paper source-reference findings, and current gate experiments were not inspected.", "potential_type": "claim", "bound_to": ["N156"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": false}

  - {"id": "O18", "timestamp": "2026-10-27T06:50:11.787228+00:00", "provenance": "ai-suggested", "content": "This finite frozen TRAIN sample is compatible with learned alpha/value matching improving label-directed margin relative to fixed controls, especially S1P1; it does not isolate mapper information, establish token factuality, or causally explain earlier VAL false-positive improvements.", "context": "${PROJECT_ROOT}/experiments/control/ds_frozen_train_readout_diagnostic_20261027/reports/REPORT_ZH.md", "potential_type": "claim", "bound_to": ["N260"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": false}

  - {"id": "O19", "timestamp": "2026-10-27T07:49:16.653423+00:00", "provenance": "ai-suggested", "content": "Frozen learned-space history-mean novelty shows empirical TRAIN marginal and within-risk ordering, with marked domain dependence, but neither weaker marginal ranking than the parent nor nonrandom conditional ranking settles usable incremental predictive information. Cosine edges remain semantically uncertified; this evidence alone does not warrant graph necessity or a GNN fit.", "context": "${PROJECT_ROOT}/experiments/control/ds_frozen_train_causal_geometry_diagnostic_20261027/reports/REPORT_ZH.md", "potential_type": "claim", "bound_to": ["N264"], "promoted": false, "promoted_to": null, "crystallized_via": null, "stale": false}
